<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
<rect width="640" height="480" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="20" y="30" font-size="16" font-weight="bold">screen 3 — diagnosis &amp; quote</text>
<text x="20" y="50" font-size="12">role: mechanic</text>
<line x1="0" y1="60" x2="640" y2="60" stroke="#000000" stroke-width="1"/>
<text x="20" y="80" font-size="11" fill="#555555">Trek Marlin #A213 — owner: J. Perez — dropped off mon 24</text>
<rect x="20" y="95" width="600" height="80" fill="#dddddd" stroke="#000000"/>
<text x="28" y="112" font-size="11">diagnosis note (free text)</text>
<text x="28" y="130" font-size="10" fill="#777777">"front derailleur cable snapped, housing worn through,</text>
<text x="28" y="146" font-size="10" fill="#777777">recommend replacing housing not just the cable..."</text>
<rect x="20" y="190" width="600" height="30" fill="#f5f5f5" stroke="#000000"/>
<text x="30" y="210" font-size="11">job (from price list)</text>
<text x="450" y="210" font-size="11">price</text>
<rect x="20" y="220" width="600" height="26" fill="#ffffff" stroke="#000000"/>
<text x="30" y="238" font-size="11">cable replacement</text>
<text x="450" y="238" font-size="11">$8.500</text>
<rect x="20" y="246" width="600" height="26" fill="#ffffff" stroke="#000000"/>
<text x="30" y="264" font-size="11">housing replacement</text>
<text x="450" y="264" font-size="11">$12.000</text>
<rect x="20" y="278" width="140" height="24" fill="#cccccc" stroke="#000000"/>
<text x="90" y="294" font-size="11" text-anchor="middle">+ add job</text>
<text x="450" y="300" font-size="11" font-weight="bold">total: $20.500</text>
<rect x="20" y="330" width="180" height="34" fill="#cccccc" stroke="#000000"/>
<text x="110" y="352" font-size="11" text-anchor="middle">send for approval</text>
<rect x="220" y="330" width="180" height="34" fill="#cccccc" stroke="#000000"/>
<text x="310" y="352" font-size="11" text-anchor="middle">mark in progress (trivial)</text>
<text x="20" y="400" font-size="11" fill="#555555">"send for approval" → status: awaiting_approval</text>
<text x="20" y="418" font-size="11" fill="#555555">"mark in progress" → status: in_progress (skips approval)</text>
<text x="20" y="450" font-size="11" fill="#555555">save → screen 2 (repair status lookup)</text>
</svg>
