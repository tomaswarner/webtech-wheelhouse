<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
<rect width="640" height="480" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="20" y="30" font-size="16" font-weight="bold">screen 2 — repair status lookup</text>
<text x="20" y="50" font-size="12">role: counter staff (the "is it ready" screen)</text>
<line x1="0" y1="60" x2="640" y2="60" stroke="#000000" stroke-width="1"/>
<rect x="20" y="80" width="300" height="26" fill="#dddddd" stroke="#000000"/>
<text x="28" y="98" font-size="12">search by phone number</text>
<rect x="330" y="80" width="90" height="26" fill="#cccccc" stroke="#000000"/>
<text x="375" y="98" font-size="12" text-anchor="middle">search</text>
<rect x="20" y="130" width="600" height="30" fill="#f5f5f5" stroke="#000000"/>
<text x="30" y="150" font-size="11">bike</text>
<text x="220" y="150" font-size="11">status</text>
<text x="380" y="150" font-size="11">promised</text>
<text x="500" y="150" font-size="11">overdue?</text>
<rect x="20" y="160" width="600" height="30" fill="#ffffff" stroke="#000000"/>
<text x="30" y="180" font-size="11">Trek Marlin #A213</text>
<text x="220" y="180" font-size="11" fill="#555555">[ ready ]</text>
<text x="380" y="180" font-size="11">thu 27</text>
<text x="500" y="180" font-size="11">no</text>
<rect x="20" y="190" width="600" height="30" fill="#ffffff" stroke="#000000"/>
<text x="30" y="210" font-size="11">Giant Escape #B045</text>
<text x="220" y="210" font-size="11" fill="#555555">[ awaiting approval ]</text>
<text x="380" y="210" font-size="11">tue 25</text>
<text x="500" y="210" font-size="11">yes, 1 day</text>
<text x="20" y="240" font-size="11" fill="#555555">empty state: "no repairs found for this number"</text>
<rect x="20" y="270" width="600" height="140" fill="#eeeeee" stroke="#000000" stroke-dasharray="4"/>
<text x="30" y="290" font-size="11">selected repair detail</text>
<text x="30" y="310" font-size="11" fill="#555555">status timeline, diagnosis note, line items, total</text>
<rect x="30" y="330" width="150" height="30" fill="#cccccc" stroke="#000000"/>
<text x="105" y="350" font-size="11" text-anchor="middle">open in mechanic view</text>
<rect x="20" y="430" width="140" height="34" fill="#cccccc" stroke="#000000"/>
<text x="90" y="452" font-size="12" text-anchor="middle">new intake</text>
<text x="200" y="452" font-size="11" fill="#555555">→ screen 1   |   "open in mechanic view" → screen 3</text>
</svg>
